name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Core tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build TypeScript and web UI
        run: pnpm build


  desktop-rust:
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare production Core runtime
        run: pnpm desktop:sidecar:prepare

      - name: Verify staged runtime
        run: |
          TARGET_TRIPLE="$(rustc --print host-tuple)"
          test -x "apps/desktop/src-tauri/binaries/mcp-gate-node-$TARGET_TRIPLE"
          test -f "apps/desktop/src-tauri/resources/core-runtime/dist/main.js"
          test -d "apps/desktop/src-tauri/resources/core-runtime/node_modules"

      - name: Check Tauri Rust shell
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
